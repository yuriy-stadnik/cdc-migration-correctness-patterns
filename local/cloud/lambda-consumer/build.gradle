plugins {
    id 'java'
}

group = 'com.example.local'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation 'com.example.cdc:transaction-protocol:1.0.0'
    implementation 'com.example.cdc:transaction-apply:1.0.0'
    implementation 'org.apache.kafka:kafka-clients:3.7.2'
    implementation 'org.postgresql:postgresql:42.7.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'org.slf4j:slf4j-simple:2.0.13'

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.jar {
    manifest {
        attributes 'Main-Class': 'com.example.local.LocalLambdaConsumer'
    }
}

tasks.register('shadowJar', Jar) {
    archiveFileName.set('local-lambda-consumer-all.jar')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'com.example.local.LocalLambdaConsumer' }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.build { dependsOn tasks.shadowJar }

tasks.test {
    useJUnitPlatform()
}
