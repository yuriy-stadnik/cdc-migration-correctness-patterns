networks:
  cdc-migration-local:
    external: true
    name: cdc-migration-local

volumes:
  cloud-zookeeper-data: {}
  cloud-zookeeper-log: {}
  cloud-kafka-data: {}
  cloud-destination-postgres-data: {}

services:
  cloud-zookeeper:
    image: confluentinc/cp-zookeeper:7.7.7
    hostname: cloud-zookeeper
    container_name: local-cloud-zookeeper
    networks: [cdc-migration-local]
    ports:
      - "22181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    volumes:
      - cloud-zookeeper-data:/var/lib/zookeeper/data
      - cloud-zookeeper-log:/var/lib/zookeeper/log

  cloud-kafka:
    image: confluentinc/cp-kafka:7.7.7
    hostname: cloud-kafka
    container_name: local-cloud-kafka
    networks: [cdc-migration-local]
    depends_on:
      - cloud-zookeeper
    ports:
      - "19092:19092"
    environment:
      KAFKA_BROKER_ID: "21"
      KAFKA_ZOOKEEPER_CONNECT: "cloud-zookeeper:2181"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:39092,PLAINTEXT_HOST://0.0.0.0:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://cloud-kafka:39092,PLAINTEXT_HOST://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_MAX_TIMEOUT_MS: "7200000"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - cloud-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server cloud-kafka:39092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  cloud-destination-postgres:
    image: postgres:16-alpine
    hostname: cloud-destination-postgres
    container_name: local-cloud-destination-postgres
    networks: [cdc-migration-local]
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: destinationdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    volumes:
      - cloud-destination-postgres-data:/var/lib/postgresql/data
      - ../../db/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d destinationdb"]
      interval: 5s
      timeout: 3s
      retries: 30

  local-lambda:
    build:
      context: ../..
      dockerfile: local/cloud/lambda-consumer/Dockerfile
    container_name: local-cloud-lambda
    networks: [cdc-migration-local]
    depends_on:
      cloud-kafka:
        condition: service_healthy
      cloud-destination-postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "cloud-kafka:39092"
      DESTINATION_DB_HOST: "cloud-destination-postgres"
      DESTINATION_DB_PORT: "5432"
      DESTINATION_DB_NAME: "destinationdb"
      DESTINATION_DB_USER: "appuser"
      DESTINATION_DB_PASSWORD: "apppass"
    restart: unless-stopped

  cloud-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: local-cloud-kafka-ui
    networks: [cdc-migration-local]
    depends_on:
      cloud-kafka:
        condition: service_healthy
    ports:
      - "18080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "cloud-emulator"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "cloud-kafka:39092"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "cloud-zookeeper:2181"
