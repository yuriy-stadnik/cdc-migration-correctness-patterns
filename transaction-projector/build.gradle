plugins {
    id 'java'
    id 'application'
}

group = 'com.example.cdc'
version = '1.0.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
repositories { mavenCentral() }

dependencies {
    implementation 'com.example.cdc:transaction-protocol:1.0.0'
    compileOnly 'org.apache.flink:flink-streaming-java:1.19.1'
    compileOnly 'org.apache.flink:flink-clients:1.19.1'
    implementation 'org.apache.flink:flink-connector-base:1.19.1'
    implementation 'org.apache.flink:flink-connector-kafka:3.3.0-1.19'
    implementation 'org.apache.flink:flink-json:1.19.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.apache.flink:flink-streaming-java:1.19.1'
    testImplementation 'org.apache.flink:flink-streaming-java:1.19.1:tests'
    testImplementation 'org.apache.flink:flink-runtime:1.19.1:tests'
    testImplementation 'org.apache.flink:flink-test-utils:1.19.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application { mainClass = 'com.example.cdc.projector.TransactionProjectorJob' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.test { useJUnitPlatform() }
tasks.register('fatJar', Jar) {
    archiveFileName.set('transaction-projector-all.jar')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': application.mainClass.get() }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
}
tasks.build { dependsOn tasks.fatJar }
