plugins {
    id 'java'
}

group = 'com.example.cdc'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.example.cdc:transaction-protocol:1.0.0'
    implementation 'com.example.cdc:transaction-apply:1.0.0'
    // Lambda core + events (MSK event)
    implementation 'com.amazonaws:aws-lambda-java-core:1.2.3'
    implementation 'com.amazonaws:aws-lambda-java-events:3.11.5'

    // AWS SDK v2 - RDS Data API
    implementation 'software.amazon.awssdk:rdsdata:2.25.60'

    // JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    implementation "org.postgresql:postgresql:42.7.4"
    implementation platform("software.amazon.awssdk:bom:2.25.50")
    implementation "software.amazon.awssdk:secretsmanager"

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'io.zonky.test:embedded-postgres:2.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('shadowJar', Jar) {
    archiveFileName.set('msk-to-aurora-lambda-1.0.0.jar')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.build {
    dependsOn tasks.shadowJar
}

tasks.test {
    useJUnitPlatform()
    systemProperty 'test.runtime.classpath', sourceSets.test.runtimeClasspath.asPath
}
